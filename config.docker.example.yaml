# daely-google-bridge — Docker config template
#
# Copy to ./config.yaml next to docker-compose.yml.
# Then run: docker compose run --rm --service-ports bootstrap
# Then:     docker compose up -d

# ─── Daely account ───────────────────────────────────────────────
daely_email: you@example.com
daely_min_pause_seconds: 1.0


# ─── Google ──────────────────────────────────────────────────────
# /secrets is the read-only volume; place google_oauth_client.json there.
google_oauth_client_secrets_file: /secrets/google_oauth_client.json
google_oauth_scopes:
  - https://www.googleapis.com/auth/calendar

# OAuth-Local-Server-Port. Default 8080. Bei Konflikt mit anderen Diensten
# auf der VM kann hier ein anderer Port gewählt werden (z. B. 8765).
# Achtung: muss mit dem SSH-Tunnel-Port übereinstimmen
# (`ssh -L PORT:localhost:PORT ...`) UND mit dem Port-Mapping des
# bootstrap-Service in der docker-compose.yml — dort ist es per
# OAUTH_LOCAL_PORT-env-Variable überschreibbar.
oauth_local_port: 8080


# ─── Profile → Google sub-calendar mapping ──────────────────────
# Bootstrap writes here. Empty {} until you run it.
profile_calendar_mapping: {}

# Optional: catch-all for events from un-profiled internal calendars.
fallback_google_calendar_id: null


# ─── Profile colors → Google event colorId ──────────────────────
# Pick a Google event-color per participant. Auto-match by default; pin a
# colorId per profile in `profile_overrides` when you want full control.
# Valid colorIds: "1"–"11" (1 Lavender, 2 Sage, 3 Grape, 4 Flamingo,
# 5 Banana, 6 Tangerine, 7 Peacock, 8 Graphite, 9 Blueberry, 10 Basil,
# 11 Tomato). Multi-participant events get a 🔴🔵-style title prefix.
color_mapping:
  enabled: true
  profile_overrides: {}
  # profile_overrides:
  #   00000000-0000-0000-0004-000000000001: "11"
  #   00000000-0000-0000-0004-000000000002: "7"


# ─── Sync schedule ───────────────────────────────────────────────
poll_interval_minutes: 15
lookback_days: 30
lookahead_days: 365


# ─── Storage ─────────────────────────────────────────────────────
# /data is the read-write volume; bridge.db lives there.
db_path: /data/bridge.db


# ─── Logging ─────────────────────────────────────────────────────
log_level: INFO
log_format: json   # docker logs --follow gives you JSON lines, easy to pipe to jq
log_file: null     # null → stdout (so docker logs sees it)
