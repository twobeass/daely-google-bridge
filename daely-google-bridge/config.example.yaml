# daely-google-bridge — example config
# Copy to config.yaml, edit, then run `bridge bootstrap` to populate the mapping.

# ─── Daely account ───────────────────────────────────────────────
# Login email of the user that owns the Daely calendar. Password is NEVER stored
# here; bootstrap will prompt and persist a refresh-token in the SQLite store.
daely_email: you@example.com

# Minimum pause between consecutive Daely API calls (in seconds).
# Be polite to the backend.
daely_min_pause_seconds: 1.0


# ─── Google ──────────────────────────────────────────────────────
# Path to the OAuth-client-secrets JSON downloaded from Google Cloud Console.
# Required scopes are read+write on Calendar.
google_oauth_client_secrets_file: ./secrets/google_oauth_client.json
google_oauth_scopes:
  - https://www.googleapis.com/auth/calendar

# OAuth-Local-Server-Port. Default 8080. Override via einen anderen Port
# (z. B. 8765), falls 8080 schon belegt ist. Muss zum SSH-Tunnel-Port passen.
oauth_local_port: 8080


# ─── Profile → Google sub-calendar mapping ──────────────────────
# This is the routing table the mapper uses. Bootstrap populates it
# automatically after creating one Google sub-calendar per Daely profile.
# Key is the Daely profile UUID; value is the Google calendarId
# (e.g. "abcd1234@group.calendar.google.com").
profile_calendar_mapping: {}

# Optional: target calendar for events whose Daely calendar has no profileId
# (e.g. shared family calendars). If unset, those events are skipped.
fallback_google_calendar_id: null


# ─── Profile colors → Google event colorId ──────────────────────
# When `enabled`, each Google event gets a `colorId` (one of Google's 11
# event colors) derived from the participant's profile color. With multiple
# participants the title is prefixed by colored emoji-dots, one per profile,
# in the same alphabetical order as the description footer.
#
# Auto-match picks the nearest of Google's 11 colors for each profile's
# `colorCode`. If two profiles auto-match into the same color and you want
# them visually distinct — or you simply prefer a different mapping — pin a
# colorId per profile in `profile_overrides`. Valid colorIds: "1"–"11".
#
# Reference (id → Google's friendly name):
#   1 Lavender   2 Sage    3 Grape    4 Flamingo  5 Banana    6 Tangerine
#   7 Peacock    8 Graphite  9 Blueberry  10 Basil   11 Tomato
color_mapping:
  enabled: true
  profile_overrides: {}
  # profile_overrides:
  #   00000000-0000-0000-0004-000000000001: "11"   # Anna → Tomato
  #   00000000-0000-0000-0004-000000000002: "7"    # Bob  → Peacock


# ─── Sync schedule ───────────────────────────────────────────────
poll_interval_minutes: 15
lookback_days: 30
lookahead_days: 365


# ─── Health-Check HTTP server ────────────────────────────────────
# Tiny stdlib server exposing /healthz, /readyz, /status while `bridge run`
# is alive. Useful for Docker HEALTHCHECK + uptime monitoring.
# Default off; set enabled: true to activate. Bind defaults to localhost —
# widen bind_host to 0.0.0.0 only behind a reverse proxy or firewall.
health_server:
  enabled: false
  bind_host: 127.0.0.1
  bind_port: 8090


# ─── Realtime push (SignalR over SSE) ────────────────────────────
# Off by default. When enabled, the bridge maintains a persistent SSE
# connection to Daely's /realtime hub and triggers a debounced incremental
# sync within seconds of each calendar change — replacing the 15-minute
# poll latency. Polling stays active as a safety net.
#
# Subscribes to user + group calendar topics by default (chores/checklists
# are off — the bridge doesn't sync those).
realtime:
  enabled: false
  debounce_seconds: 2.0
  subscribe_user_calendars: true
  subscribe_group_calendars: true
  subscribe_chores: false
  subscribe_checklists: false


# ─── Storage ─────────────────────────────────────────────────────
db_path: ./bridge.db


# ─── Logging ─────────────────────────────────────────────────────
log_level: INFO        # DEBUG / INFO / WARNING / ERROR
log_format: json       # "json" or "text"
log_file: null         # null → stdout
