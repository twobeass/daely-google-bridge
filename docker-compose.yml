# daely-google-bridge — deploy compose
#
# Standalone use (no `git clone` needed):
#
#     mkdir bridge && cd bridge
#     curl -O https://raw.githubusercontent.com/twobeass/daely-google-bridge/main/docker-compose.yml
#     curl -o config.yaml https://raw.githubusercontent.com/twobeass/daely-google-bridge/main/config.docker.example.yaml
#     mkdir -p data secrets
#     sudo chown -R 1100:1100 data && chmod 700 secrets
#     # edit config.yaml, drop google_oauth_client.json into secrets/, then:
#     docker compose run --rm --service-ports bootstrap
#     docker compose up -d
#
# Override BRIDGE_IMAGE if you want a self-built image instead.

services:
  bridge:
    image: ${BRIDGE_IMAGE:-ghcr.io/twobeass/daely-google-bridge:latest}
    container_name: daely-google-bridge
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=${TZ:-Europe/Berlin}
    command: ["run"]
    # `bridge doctor` validates config/DB/tokens and flags a stale sync loop
    # (last sync older than 2× poll_interval) — a real wedged-scheduler signal,
    # unlike a bare liveness probe. Runs offline (no `--live`), and a parallel
    # reader process is supported by design (WAL + explicit checkpoint).
    # Earlier versions used `pgrep`, which isn't installed in the slim image.
    healthcheck:
      test: ["CMD", "bridge", "-c", "/app/config.yaml", "doctor"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s

  # One-shot bootstrap helper. Run with:
  #   docker compose run --rm --service-ports bootstrap
  bootstrap:
    image: ${BRIDGE_IMAGE:-ghcr.io/twobeass/daely-google-bridge:latest}
    profiles: ["bootstrap"]
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./config.yaml:/app/config.yaml
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - BRIDGE_OAUTH_HOST=0.0.0.0
    # If you set `oauth_local_port` in config.yaml to something other than
    # 8080, override OAUTH_LOCAL_PORT here too — and use the same number in
    # your SSH tunnel (`ssh -L NNNN:localhost:NNNN ...`).
    ports:
      - "${OAUTH_LOCAL_PORT:-8080}:${OAUTH_LOCAL_PORT:-8080}"
    stdin_open: true
    tty: true
    command: ["bootstrap"]

  # Convenience: `docker compose --profile ops run --rm status`
  status:
    image: ${BRIDGE_IMAGE:-ghcr.io/twobeass/daely-google-bridge:latest}
    profiles: ["ops"]
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=${TZ:-Europe/Berlin}
    command: ["status"]
