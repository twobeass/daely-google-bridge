name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daely-google-bridge/pyproject.toml

      - name: install package + dev deps
        working-directory: daely-google-bridge
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: run pytest
        working-directory: daely-google-bridge
        run: pytest -q --tb=short
